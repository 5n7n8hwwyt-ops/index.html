<style>
:root {
  --bg:#f5f7fa; --card:#ffffff; --text:#17202a; --muted:#65717e;
  --line:#e2e7ec; --accent:#146c94; --accent2:#0d8b75;
  --danger:#b42318; --shadow:0 4px 18px rgba(20,35,50,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.container{max-width:1200px;margin:0 auto;padding:28px 18px 50px}
header{margin-bottom:22px}
h1{margin:0 0 7px;font-size:30px}
.subtitle{color:var(--muted);margin:0}
.toolbar{position:sticky;top:0;z-index:5;background:rgba(245,247,250,.96);backdrop-filter:blur(8px);padding:12px 0}
.search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;font-size:16px;outline:none;background:#fff;box-shadow:var(--shadow)}
.search:focus{border-color:var(--accent)}
.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}
button,.select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-size:14px;cursor:pointer}
button:hover{border-color:#aeb9c4}
button.active{background:#e8f3f8;border-color:#9cc8d8;color:#0c5675;font-weight:600}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 14px;min-width:130px}
.stat b{font-size:20px;display:block}
.stat span{font-size:12px;color:var(--muted)}
.progress{height:8px;background:#e3e8ec;border-radius:99px;overflow:hidden;margin:0 0 18px}
.progress > div{height:100%;background:var(--accent2);width:0%;transition:.2s}
.list{display:grid;gap:10px}
.company{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:13px}
.check{width:22px;height:22px;margin-top:2px;accent-color:var(--accent2);cursor:pointer}
.top{display:flex;gap:9px;align-items:flex-start;justify-content:space-between}
.name{font-size:17px;font-weight:700;margin:0}
.no{font-size:12px;color:var(--muted);white-space:nowrap}
.company.done .name{text-decoration:line-through;color:#7b8791}
.details{margin-top:8px;color:#4e5b67;font-size:14px;line-height:1.55}
.details strong{color:#29343e}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.links a{font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:5px 8px;color:#0d607f;background:#fbfdfe}
.empty{text-align:center;padding:40px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:14px}
.footer{margin-top:22px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:650px){h1{font-size:24px}.top{display:block}.no{display:block;margin-top:3px}}
</style>
</head>

<div class="container">
<header>

</header>

<div class="toolbar">

  <div class="controls">
    <button class="filter active" data-filter="all">All</button>
    <button class="filter" data-filter="remaining">Remaining</button>
    <button class="filter" data-filter="done">Completed</button>
    <button id="clearSearch">Clear search</button>
    <button id="reset">Reset checklist</button>
  </div>
</div>

<div class="stats">

<div class="progress"><div id="bar"></div></div>
<div id="list" class="list"></div>
<div class="footer">Your checklist is saved automatically in this browser.</div>
</div>

const KEY = "rusayl-company-checklist-v1";
let saved = JSON.parse(localStorage.getItem(KEY) || "{}");
companies.forEach(c => c.checked = !!saved[c.no]);
let currentFilter = "all";

const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[ch]);

function normalize(s) {
  return String(s ?? "").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"");
}
function save() {
  const obj={};
  companies.forEach(c => obj[c.no]=c.checked);
  localStorage.setItem(KEY, JSON.stringify(obj));
}
function websiteHref(w) {
  let x=w.replace(/\\/g,"").trim();
  if (!/^https?:\/\//i.test(x)) x="https://"+x;
  return x;
}
function emailLinks(emails) {
  return emails.map(e=>`<a href="mailto:${esc(e)}">✉ ${esc(e)}</a>`).join("");
}
function render() {
  const q=normalize(document.getElementById("search").value);
  let filtered=companies.filter(c => {
    const matchFilter=currentFilter==="all" || (currentFilter==="done" ? c.checked : !c.checked);
    const hay=normalize([c.company,...c.products,c.phone,...c.emails,...c.websites].join(" "));
    return matchFilter && hay.includes(q);
  });
  document.getElementById("shown").textContent=filtered.length;
  const list=document.getElementById("list");
  if(!filtered.length) {
    list.innerHTML='<div class="empty">No companies match your search.</div>';
  } else {
    list.innerHTML=filtered.map(c=>{
      const products=c.products.length ? c.products.map(x=>esc(x)).join("<br>") : "Not provided";
      const phones=c.phone.length ? c.phone.map(x=>esc(x)).join(" · ") : "Not provided";
      const web=c.websites.map(w=>`<a href="${esc(websiteHref(w))}" target="_blank" rel="noopener">🌐 Website</a>`).join("");
      return `<article class="company ${c.checked?"done":""}">
        <input class="check" type="checkbox" ${c.checked?"checked":""} aria-label="Mark ${esc(c.company)} complete" onchange="toggleCompany(${c.no},this.checked)">
        <div>
          <div class="top"><h2 class="name">${esc(c.company)}</h2><span class="no">#${c.no}</span></div>
          <div class="details"><strong>Products / Services:</strong><br>${products}<br><strong>Phone:</strong> ${phones}</div>
          <div class="links">${emailLinks(c.emails)}${web}</div>
        </div>
      </article>`;
    }).join("");
  }
  const done=companies.filter(c=>c.checked).length;
  document.getElementById("total").textContent=companies.length;
  document.getElementById("completed").textContent=done;
  document.getElementById("remaining").textContent=companies.length-done;
  document.getElementById("bar").style.width=(companies.length?done/companies.length*100:0)+"%";
}
function toggleCompany(no,val) {
  const c=companies.find(x=>x.no===no); if(c) c.checked=val;
  save(); render();
}
document.getElementById("search").addEventListener("input",render);
document.querySelectorAll(".filter").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); currentFilter=b.dataset.filter; render();
}));
document.getElementById("clearSearch").onclick=()=>{document.getElementById("search").value="";render();document.getElementById("search").focus()};
document.getElementById("reset").onclick=()=>{
  if(confirm("Reset all checklist progress?")){companies.forEach(c=>c.checked=false);save();render();}
};
render();
</script>
